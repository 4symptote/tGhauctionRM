name: Java CI with Maven

# Các sự kiện kích hoạt Workflow
on:
  push:
    branches: [ "main", "dev", "zev" ] # Đổi tên nhánh cho phù hợp với repo của bạn
  pull_request:
    branches: [ "main", "dev", "zev" ]

jobs:
  build-and-test:
    name: Build and Run Tests
    runs-on: ubuntu-latest # Chạy trên môi trường Ubuntu ảo của máy chủ GitHub

    steps:
    # 1. Tải source code từ repository về máy ảo
    - name: Checkout source code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Java (JDK) trên máy ảo
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'            # Phiên bản Java (Thay bằng 21 nếu dự án dùng Java 21)
        distribution: 'temurin'       # Bản phân phối JDK phổ biến
        cache: maven                  # Lưu cache các thư viện để lần chạy sau nhanh hơn

    # 3. Biên dịch và tự động chạy test bằng Maven
    - name: Build and Test with Maven
      run: mvn clean install -B

    # (Tùy chọn) 4. Kiểm tra mã nguồn (Checkstyle) nếu bạn đã tích hợp trong pom.xml
    # - name: Check code style
    #   run: mvn checkstyle:check
